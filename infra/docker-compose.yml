services:
  redis:
    image: redis:latest
    container_name: marlin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./containers/redis/data:/data
    command: redis-server --appendonly yes

  postgres:
    image: postgres:latest
    container_name: marlin_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edna_vectordb
    volumes:
      - ./containers/postgres/data:/var/lib/postgresql

  minio:
    image: minio/minio:latest
    container_name: marlin_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./containers/minio/data:/data
    command: server /data --console-address ":9001"

  nginx:
    image: nginx:latest
    container_name: marlin_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./containers/nginx/conf:/etc/nginx/conf.d
      - ./containers/nginx/html:/usr/share/nginx/html
      - ./containers/nginx/logs:/var/log/nginx