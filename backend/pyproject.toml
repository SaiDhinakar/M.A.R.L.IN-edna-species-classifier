[project]
name = "marlin-backend"
version = "0.1.0"
description = "M.A.R.L.IN eDNA AI Classification System - Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # FastAPI & Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    # Database
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    # Object Storage & Caching
    "minio>=7.2.10",
    "redis>=5.2.0",
    "hiredis>=3.0.0",
    # ML & Data Science
    "torch>=2.5.1",
    "transformers>=4.46.3",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    "faiss-cpu>=1.9.0",
    "hdbscan>=0.8.38",
    # MLOps
    "mlflow>=2.17.2",
    "zenml>=0.70.0",
    # Bioinformatics
    "biopython>=1.84",
    # Utilities
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "aiofiles>=24.1.0",
    "sqlalchemy-utils>=0.42.0",
    "sqlmodel>=0.0.27",
    "pymysql>=1.1.2",
    "passlib==1.7.4",
    "bcrypt==3.2.2",
    "email-validator>=2.3.0",
    "dnspython>=2.8.0",
    "gputil>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "ruff>=0.7.4",
]
